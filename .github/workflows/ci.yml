name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy?schema=public

      - name: Build NestJS application
        run: npm run build

      - name: Run unit & integration tests
        run: npx jest --runInBand --coverage=false
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy?schema=public
          JWT_ACCESS_SECRET: test-jwt-access-secret-minimum-length-key-lampung
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-minimum-length-key-lampung
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ML_ENGINE_URL: http://localhost:8000
          PORT: 4000

      - name: Run RAG retrieval evaluation gate
        run: npm run test:eval
        env:
          NODE_ENV: test

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build
