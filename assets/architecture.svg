<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Diagram Arsitektur Runtime Web KelanaLampung</title>
  <desc id="archDesc">Diagram topologi sistem web yang menampilkan hubungan antara Browser Frontend, NestJS BFF Gateway, PostgreSQL, Redis, FastAPI ML Engine, OSRM, dan 9Router LLM Gateway.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="frontend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="ml" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="20" fill="url(#canvas)"/>
  <path d="M0 510 C240 420 400 590 650 490 S980 410 1200 500 V640 H0Z" fill="#ccfbf1" opacity="0.5"/>

  <text x="60" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">KelanaLampung — Arsitektur Runtime Web</text>
  <text x="60" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">Topologi Tiga-Tier: Frontend SPA · NestJS BFF Gateway · PostgreSQL / Redis · FastAPI ML Service</text>

  <!-- Browser Layer -->
  <g filter="url(#shadow)">
    <rect x="60" y="150" width="280" height="175" rx="14" fill="url(#frontend)"/>
    <rect x="76" y="166" width="36" height="36" rx="8" fill="#ccfbf1" opacity="0.9"/>
    <path d="M86 184 h16 M94 176 v16" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round"/>
    <text x="124" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Browser Client (SPA)</text>
    <text x="76" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ccfbf1">React 18 · Vite 5 · Port 3001</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#e6fffa">
      <text x="76" y="248">Public: /, /explore, /share/:token</text>
      <text x="76" y="268">Protected: /planner, /favorites, /profile</text>
      <text x="76" y="288">Admin: /admin/submissions, /submit-place</text>
      <text x="76" y="308">Leaflet Map · RadenGajah Chatbot Widget</text>
    </g>
  </g>

  <!-- NestJS BFF Gateway Layer -->
  <g filter="url(#shadow)">
    <rect x="460" y="130" width="320" height="215" rx="14" fill="url(#backend)"/>
    <text x="484" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">NestJS BFF Gateway</text>
    <text x="484" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#cffafe">REST API /api/v1 · Port 4000 · /docs (Swagger)</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#e0f2fe">
      <text x="484" y="216">Auth Module (JWT 15m + Refresh 7d Cookie)</text>
      <text x="484" y="236">Throttler Guard (60 req/min) + Helmet</text>
      <text x="484" y="256">RAG Retriever Service (BM25 Keyword Match)</text>
      <text x="484" y="276">Place Submission, Dedup &amp; Moderation</text>
      <text x="484" y="296">Itineraries &amp; Public Share Token Resolver</text>
      <text x="484" y="316">Proxy Handler ke FastAPI ML Engine</text>
      <text x="484" y="334">Health Check (/api/v1/health)</text>
    </g>
  </g>

  <!-- FastAPI ML Engine Layer -->
  <g filter="url(#shadow)">
    <rect x="890" y="145" width="250" height="185" rx="14" fill="url(#ml)"/>
    <text x="914" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">FastAPI ML Engine</text>
    <text x="914" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">REST Service · Port 8000</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#e0e7ff">
      <text x="914" y="230">Candidate 4 Hybrid Recommender</text>
      <text x="914" y="250">Planner Multi-Day Slot Generator</text>
      <text x="914" y="270">NLP Sentiment Analyzer (Indonesian)</text>
      <text x="914" y="290">CatalogStore Durable JSON Overlay</text>
      <text x="914" y="310">3,130 Verified Lampung Attractions</text>
    </g>
  </g>

  <!-- Storage: PostgreSQL -->
  <g filter="url(#shadow)">
    <rect x="330" y="470" width="220" height="120" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="440" cy="495" rx="60" ry="14" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <path d="M380 495 v35 c0 8 27 14 60 14 s60 -6 60 -14 v-35" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="440" y="562" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1e293b">PostgreSQL</text>
    <text x="440" y="580" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Prisma ORM · 9 Relational Models</text>
  </g>

  <!-- Storage: Redis -->
  <g filter="url(#shadow)">
    <rect x="580" y="470" width="200" height="120" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="635" y="492" width="90" height="42" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <path d="M650 505 h60 M650 517 h40" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    <text x="680" y="562" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1e293b">Redis (:6379)</text>
    <text x="680" y="580" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Cache · Token Blacklist · Fallback</text>
  </g>

  <!-- External: 9Router -->
  <g>
    <rect x="60" y="400" width="180" height="60" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="150" y="426" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#92400e">9Router Gateway</text>
    <text x="150" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#a16207">OpenAI-compatible (:20128)</text>
  </g>

  <!-- External: OSRM -->
  <g>
    <rect x="60" y="480" width="180" height="60" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="150" y="506" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#115e59">OSRM Routing</text>
    <text x="150" y="525" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f766e">router.project-osrm.org</text>
  </g>

  <!-- Connecting Lines -->
  <path d="M340 237 H460" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">Vite Proxy</text>

  <path d="M780 237 H890" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrowTeal)"/>
  <text x="835" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f766e">HTTP REST</text>

  <path d="M560 345 L460 470" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M640 345 L670 470" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M460 310 L240 425" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M200 325 L160 480" stroke="#14b8a6" stroke-width="2" fill="none" marker-end="url(#arrowTeal)"/>
</svg>